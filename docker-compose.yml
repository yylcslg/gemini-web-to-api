services:
  app:
    build: .
    container_name: app
    ports:
      - "4981:4981"
    restart: unless-stopped
    volumes:
      - ./config.yml:/home/appuser/config.yml:ro
      - ./.cookies:/home/appuser/.cookies
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4981/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
